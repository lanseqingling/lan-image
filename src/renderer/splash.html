<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --splash-bg: #f7f8fa;
      --splash-text: #111827;
      --splash-subtext: #6b7280;
      --splash-accent: #62c9c7;
      --splash-accent-soft: rgba(98, 201, 199, 0.11);
      --splash-top-light: rgba(255, 255, 255, 0.42);
      --splash-logo-shine: rgba(255, 255, 255, 0.28);
      --splash-logo-shadow-accent: rgba(98, 201, 199, 0.07);
      --splash-logo-shadow: rgba(15, 23, 42, 0.05);
    }

    [data-theme="dark"] {
      --splash-bg: #1e1e1e;
      --splash-text: #f4f4f5;
      --splash-subtext: #a1a1aa;
      --splash-accent-soft: rgba(98, 201, 199, 0.1);
      --splash-top-light: rgba(255, 255, 255, 0.04);
      --splash-logo-shine: rgba(255, 255, 255, 0.2);
      --splash-logo-shadow-accent: rgba(98, 201, 199, 0.07);
      --splash-logo-shadow: rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--splash-bg);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 46%, var(--splash-accent-soft), transparent 14%),
        linear-gradient(180deg, var(--splash-top-light), transparent 42%);
      pointer-events: none;
    }

    [data-theme="dark"] body::before {
      background:
        radial-gradient(circle at 50% 46%, var(--splash-accent-soft), transparent 15%),
        linear-gradient(180deg, var(--splash-top-light), transparent 44%);
    }

    .splash {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-content {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: contentIn 560ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .splash-logo {
      position: relative;
      width: 112px;
      height: 112px;
      border-radius: 26px;
      box-shadow:
        0 4px 9px var(--splash-logo-shadow-accent),
        0 2px 6px var(--splash-logo-shadow);
      overflow: hidden;
      animation: logoBreathe 2.8s ease-in-out infinite;
    }

    .splash-logo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--splash-logo-shine), transparent 42%);
      pointer-events: none;
    }

    .splash-logo img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .splash-title {
      margin-top: 30px;
      color: var(--splash-accent);
      font-size: 36px;
      font-weight: 650;
      line-height: 1;
      letter-spacing: 0;
    }

    .splash-subtitle {
      margin-top: 12px;
      color: var(--splash-subtext);
      font-size: 13px;
      line-height: 1;
      letter-spacing: 0;
    }

    @keyframes contentIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes logoBreathe {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-content,
      .splash-logo {
        animation: none;
      }
    }

    [data-disable-animation="true"] .splash-content,
    [data-disable-animation="true"] .splash-logo {
      animation: none;
    }
  </style>
  <script>
    if (localStorage.getItem('lanimage-darkmode') === 'true') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
    if (
      new URLSearchParams(location.search).get('disableAnimation') === 'true' ||
      localStorage.getItem('lanimage-disable-startup-animation') === 'true'
    ) {
      document.documentElement.setAttribute('data-disable-animation', 'true');
    }
  </script>
</head>
<body>
  <div class="splash">
    <div class="splash-content">
      <div class="splash-logo">
        <img src="../../assets/icons/icon.png" alt="LanImage">
      </div>
      <div class="splash-title">LanImage</div>
      <div class="splash-subtitle">LOCAL IMAGE VIEWER</div>
    </div>
  </div>
</body>
</html>
