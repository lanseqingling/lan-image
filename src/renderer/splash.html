<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      transition: background 0.2s ease;
    }
    [data-theme="dark"] body {
      background: #1e1e1e;
    }
    .splash {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .splash-logo {
      width: 140px;
      height: 140px;
      border-radius: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      animation: float 2s ease-in-out infinite;
    }
    [data-theme="dark"] .splash-logo {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .splash-logo img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .splash-title {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 52px;
    }
    .splash-title svg {
      height: 52px;
      width: auto;
      overflow: visible;
    }
    .splash-title-text {
      fill: #1d1d1f;
    }
    [data-theme="dark"] .splash-title-text {
      fill: #cccccc;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
  <script>
    if (localStorage.getItem('lanimage-darkmode') === 'true') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
<body>
  <div class="splash">
    <div class="splash-logo">
      <img src="../../assets/icons/icon.png" alt="LanImage">
    </div>
    <div class="splash-title">
      <svg viewBox="0 0 200 52" xmlns="http://www.w3.org/2000/svg">
        <text class="splash-title-text" x="100" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="500" letter-spacing="2" style="font-smooth: antialiased;">LanImage</text>
      </svg>
    </div>
  </div>
</body>
</html>
