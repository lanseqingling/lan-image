<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LanImage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="titlebar">
    <div class="titlebar-menus">
      <img id="app-icon" src="../../assets/icons/icon.png" alt="LanImage">
      <div class="titlebar-menu-item" id="menu-file">文件
        <div class="titlebar-dropdown" id="dropdown-file">
          <div class="titlebar-dropdown-item" id="menu-add-folder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span>添加文件夹</span>
          </div>
          <div class="titlebar-dropdown-item" id="menu-settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>设置</span>
          </div>
          <div class="titlebar-dropdown-separator"></div>
          <div class="titlebar-dropdown-item" id="menu-quit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>退出</span>
          </div>
        </div>
      </div>
      <div class="titlebar-menu-item" id="menu-view">查看
        <div class="titlebar-dropdown" id="dropdown-view">
          <div class="titlebar-dropdown-item" id="menu-refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            <span>刷新</span>
          </div>
          <div class="titlebar-dropdown-separator"></div>
          <div class="titlebar-dropdown-item titlebar-dropdown-disabled" style="font-size:12px;color:var(--text-tertiary);cursor:default;padding:5px 12px 3px;">
            查看模式
          </div>
          <div class="titlebar-dropdown-item" id="menu-mode-waterfall">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="12" rx="1"/></svg>
            <span>瀑布流</span>
            <svg class="mode-check-waterfall check-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;width:6px;height:6px;margin-left:auto;color:var(--accent-color)"><circle cx="12" cy="12" r="12"/></svg>
          </div>
          <div class="titlebar-dropdown-item" id="menu-mode-horizontal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><polyline points="10 9 14 12 10 15"/></svg>
            <span>横向翻页</span>
            <svg class="mode-check-horizontal check-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;width:6px;height:6px;margin-left:auto;color:var(--accent-color)"><circle cx="12" cy="12" r="12"/></svg>
          </div>
          <div class="titlebar-dropdown-item" id="menu-mode-grid">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>文件列表</span>
            <svg class="mode-check-grid check-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;width:6px;height:6px;margin-left:auto;color:var(--accent-color)"><circle cx="12" cy="12" r="12"/></svg>
          </div>
          <div class="titlebar-dropdown-separator"></div>
          <div class="titlebar-dropdown-item titlebar-dropdown-disabled" style="font-size:12px;color:var(--text-tertiary);cursor:default;padding:5px 12px 3px;">
            布局列数
          </div>
          <div class="titlebar-dropdown-item" id="menu-cols-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            <span>单列</span>
            <svg class="view-check-1 check-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;width:6px;height:6px;margin-left:auto;color:var(--accent-color)"><circle cx="12" cy="12" r="12"/></svg>
          </div>
          <div class="titlebar-dropdown-item" id="menu-cols-2">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="18" rx="2"/><rect x="13" y="3" width="8" height="18" rx="2"/></svg>
            <span>双列</span>
            <svg class="view-check-2 check-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;width:6px;height:6px;margin-left:auto;color:var(--accent-color)"><circle cx="12" cy="12" r="12"/></svg>
          </div>
          <div class="titlebar-dropdown-item" id="menu-cols-3">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="5" height="18" rx="1"/><rect x="9.5" y="3" width="5" height="18" rx="1"/><rect x="17" y="3" width="5" height="18" rx="1"/></svg>
            <span>三列</span>
            <svg class="view-check-3 check-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;width:6px;height:6px;margin-left:auto;color:var(--accent-color)"><circle cx="12" cy="12" r="12"/></svg>
          </div>
        </div>
      </div>
      <div class="titlebar-menu-item" id="menu-window">窗口
        <div class="titlebar-dropdown" id="dropdown-window">
          <div class="titlebar-dropdown-item" id="menu-minimize">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/></svg>
            <span>最小化</span>
          </div>
          <div class="titlebar-dropdown-item" id="menu-maximize">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            <span>最大化</span>
          </div>
          <div class="titlebar-dropdown-separator"></div>
          <div class="titlebar-dropdown-item" id="menu-close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            <span>关闭</span>
          </div>
        </div>
      </div>
      <div class="titlebar-menu-item" id="menu-help">帮助
        <div class="titlebar-dropdown" id="dropdown-help">
          <div class="titlebar-dropdown-item" id="menu-github">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            <span>GitHub 仓库</span>
          </div>
        </div>
      </div>
    </div>
    <div class="titlebar-drag"></div>
    <div class="titlebar-controls">
      <button class="titlebar-btn titlebar-minimize" id="btn-minimize" title="最小化">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="titlebar-btn titlebar-maximize" id="btn-maximize" title="最大化">
        <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="titlebar-btn titlebar-close" id="btn-close" title="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>
  <div id="settings-page" class="hidden">
    <button id="settings-back-btn" title="返回首页">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="settings-scroll">
      <div class="settings-center">
        <div class="settings-section">
          <div class="settings-section-title">查看</div>
          <div class="settings-subtitle">查看模式</div>
          <div class="settings-mode-cards" id="settings-view-mode">
            <label class="settings-mode-card" data-value="waterfall">
              <input type="radio" name="view-mode" value="waterfall">
              <div class="settings-mode-card-left">
                <svg class="settings-mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="12" rx="1"/></svg>
                <div class="settings-mode-text">
                  <div class="settings-mode-name">瀑布流</div>
                  <div class="settings-mode-desc">按原始比例多列展示图片</div>
                </div>
              </div>
              <span class="settings-mode-check"></span>
            </label>
            <label class="settings-mode-card" data-value="horizontal">
              <input type="radio" name="view-mode" value="horizontal">
              <div class="settings-mode-card-left">
                <svg class="settings-mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><polyline points="10 9 14 12 10 15"/></svg>
                <div class="settings-mode-text">
                  <div class="settings-mode-name">横向翻页</div>
                  <div class="settings-mode-desc">单张浏览，左右翻页切换</div>
                </div>
              </div>
              <span class="settings-mode-check"></span>
            </label>
            <label class="settings-mode-card" data-value="grid">
              <input type="radio" name="view-mode" value="grid">
              <div class="settings-mode-card-left">
                <svg class="settings-mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                <div class="settings-mode-text">
                  <div class="settings-mode-name">文件列表</div>
                  <div class="settings-mode-desc">网格缩略图与文件名展示</div>
                </div>
              </div>
              <span class="settings-mode-check"></span>
            </label>
          </div>
          <div class="settings-subtitle">布局</div>
          <div class="settings-layout-row" id="settings-waterfall-cols">
            <label class="settings-layout-option" data-value="1">
              <input type="radio" name="waterfall-cols" value="1">
              <span class="settings-layout-label">单列</span>
              <span class="settings-layout-check"></span>
            </label>
            <label class="settings-layout-option" data-value="2">
              <input type="radio" name="waterfall-cols" value="2">
              <span class="settings-layout-label">双列</span>
              <span class="settings-layout-check"></span>
            </label>
            <label class="settings-layout-option" data-value="3">
              <input type="radio" name="waterfall-cols" value="3">
              <span class="settings-layout-label">三列</span>
              <span class="settings-layout-check"></span>
            </label>
          </div>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-section">
          <div class="settings-section-title">外观</div>
          <div class="settings-hint">即将支持</div>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-section">
          <div class="settings-section-title">关于</div>
          <div class="settings-about-item">
            <span class="settings-about-label">版本</span>
            <span class="settings-about-value" id="settings-version">-</span>
          </div>
          <div class="settings-about-item">
            <span class="settings-about-label">作者</span>
            <span class="settings-about-value">蓝色蜻蛉</span>
          </div>
          <div class="settings-about-item">
            <span class="settings-about-label">GitHub</span>
            <a class="settings-link" id="settings-github-link">lan-image</a>
          </div>
          <div class="settings-about-item">
            <span class="settings-about-label">最新版本</span>
            <a class="settings-link" id="settings-release-link" target="_blank" rel="noopener">Release</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <button id="add-folder-btn" title="添加文件夹">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button id="sidebar-collapse-btn" title="收起侧边栏">
          <svg class="collapse-icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <svg class="collapse-icon-right" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
      <div id="workspace-list"></div>
    </aside>
    <div id="sidebar-resize-handle" class="sidebar-resize-handle"></div>
    <main id="content">
      <div id="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>点击左侧 <strong>+</strong> 按钮添加图片文件夹</p>
      </div>
      <div id="waterfall-container"></div>
      <div id="grid-container" class="hidden"></div>
      <div id="horizontal-viewer" class="hidden">
        <button id="hv-prev" class="hv-nav-btn hv-nav-prev" title="上一张">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div id="hv-image-area">
          <img id="hv-image" src="" alt="">
        </div>
        <button id="hv-next" class="hv-nav-btn hv-nav-next" title="下一张">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div id="hv-thumbnail-strip"></div>
        <div id="hv-counter"></div>
      </div>
    </main>
  </div>

  <div id="image-viewer" class="hidden">
    <div id="viewer-backdrop"></div>
    <div id="viewer-content">
      <img id="viewer-image" src="" alt="">
    </div>
    <button id="viewer-close" title="关闭">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div id="rename-dialog" class="dialog-overlay hidden">
    <div class="dialog-box">
      <div class="dialog-title">重命名</div>
      <div class="dialog-hint">仅修改显示名称，不修改底层文件夹</div>
      <input type="text" id="rename-input" class="dialog-input" />
      <div class="dialog-actions">
        <button id="rename-cancel" class="dialog-btn dialog-btn-cancel">取消</button>
        <button id="rename-confirm" class="dialog-btn dialog-btn-confirm">确定</button>
      </div>
    </div>
  </div>

  <div id="properties-dialog" class="dialog-overlay hidden">
    <div class="dialog-box prop-dialog-box">
      <div class="dialog-title">属性</div>
      <div class="prop-info">
        <div class="prop-row">
          <span class="prop-label">名称</span>
          <span class="prop-value" id="prop-name"></span>
        </div>
        <div class="prop-row">
          <span class="prop-label">类型</span>
          <span class="prop-value" id="prop-type"></span>
        </div>
        <div class="prop-row">
          <span class="prop-label">位置</span>
          <span class="prop-value prop-location" id="prop-location"></span>
        </div>
        <div class="prop-row">
          <span class="prop-label">大小</span>
          <span class="prop-value" id="prop-size"></span>
        </div>
        <div class="prop-row">
          <span class="prop-label">尺寸</span>
          <span class="prop-value" id="prop-dimensions"></span>
        </div>
        <div class="prop-row">
          <span class="prop-label">创建时间</span>
          <span class="prop-value" id="prop-created"></span>
        </div>
        <div class="prop-row">
          <span class="prop-label">修改时间</span>
          <span class="prop-value" id="prop-modified"></span>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="properties-close" class="dialog-btn dialog-btn-confirm">确定</button>
      </div>
    </div>
  </div>

  <div id="folder-properties-dialog" class="dialog-overlay hidden">
    <div class="dialog-box prop-dialog-box">
      <div class="dialog-title">文件夹属性</div>
      <div class="prop-info">
        <div class="prop-row">
          <span class="prop-label">名称</span>
          <span class="prop-value" id="folder-prop-name"></span>
        </div>
        <div class="prop-row">
          <span class="prop-label">位置</span>
          <span class="prop-value prop-location" id="folder-prop-location"></span>
        </div>
        <div class="prop-row">
          <span class="prop-label">图片数量</span>
          <span class="prop-value" id="folder-prop-count"></span>
        </div>
        <div class="prop-row">
          <span class="prop-label">总大小</span>
          <span class="prop-value" id="folder-prop-size"></span>
        </div>
        <div class="prop-row">
          <span class="prop-label">创建时间</span>
          <span class="prop-value" id="folder-prop-created"></span>
        </div>
        <div class="prop-row">
          <span class="prop-label">修改时间</span>
          <span class="prop-value" id="folder-prop-modified"></span>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="folder-properties-close" class="dialog-btn dialog-btn-confirm">确定</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
